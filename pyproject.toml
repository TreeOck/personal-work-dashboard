[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-work-dashboard"
version = "1.0.2"
description = "A local day / week / month view of your own git commits, plus a current-tasks board your AI agent keeps in sync."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aditya Nair"}]
keywords = ["git", "commits", "dashboard", "time tracking", "mcp", "ai agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/TreeOck/personal-work-dashboard"
Documentation = "https://github.com/TreeOck/personal-work-dashboard/tree/main/docs"
Changelog = "https://github.com/TreeOck/personal-work-dashboard/blob/main/CHANGELOG.md"
Issues = "https://github.com/TreeOck/personal-work-dashboard/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tracker = "personal_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_tracker = ["templates/*.html", "templates/*.md", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
