[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-work-dashboard"
version = "0.8.0"
description = "A local day / week / month view of your own git commits, plus a current-tasks board."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tracker = "personal_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_tracker = ["templates/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
