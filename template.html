<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Work Tracker</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#fff; --surface2:#f0eee8; --text:#1c1b18; --muted:#6b675e; --line:#e3e0d6;
  --accent:#2f5d50; --accent-soft:#dfece7;
  --feature:#2f5d50; --fix:#b4532a; --infra:#3d5a9e; --docs:#7a6a2f; --other:#6b675e;
  --heat0:#ebe8df; --heat1:#c5ddd3; --heat2:#8fbfae; --heat3:#4f9680; --heat4:#2f5d50;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --surface:#1d1f25; --surface2:#262932; --text:#ecebe6; --muted:#9b9a93; --line:#31343d;
    --accent:#7fc4ad; --accent-soft:#22352f;
    --feature:#7fc4ad; --fix:#e59a74; --infra:#8fa8e6; --docs:#d1c177; --other:#9b9a93;
    --heat0:#262932; --heat1:#25413a; --heat2:#2f6355; --heat3:#4a9a82; --heat4:#7fc4ad;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --surface:#1d1f25; --surface2:#262932; --text:#ecebe6; --muted:#9b9a93; --line:#31343d;
  --accent:#7fc4ad; --accent-soft:#22352f;
  --feature:#7fc4ad; --fix:#e59a74; --infra:#8fa8e6; --docs:#d1c177; --other:#9b9a93;
  --heat0:#262932; --heat1:#25413a; --heat2:#2f6355; --heat3:#4a9a82; --heat4:#7fc4ad;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
button,input{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi b>span{font-size:17px}
.kpi>span{color:var(--muted);font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tabs{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px}
.tab{border:0;background:transparent;padding:6px 16px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.group{margin-bottom:26px}
.group>h2{font-size:15px;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group>h2 small{color:var(--muted);font-weight:400;font-size:12.5px}
.proj{margin:10px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.proj>h3{margin:0;padding:9px 14px;font-size:13px;background:var(--surface2);display:flex;justify-content:space-between;gap:8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.task{padding:12px 14px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task-top{display:flex;gap:8px;align-items:flex-start}
.kind{flex:none;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid currentColor;border-radius:5px;padding:0 6px;margin-top:3px}
.kind.feature{color:var(--feature)}.kind.fix{color:var(--fix)}.kind.infra{color:var(--infra)}.kind.docs{color:var(--docs)}.kind.unsummarised{color:var(--fix);border-style:dashed}
.task-title{font-weight:600}
.task-sum{color:var(--muted);margin:3px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.add{color:var(--feature)}.del{color:var(--fix)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--accent);font-size:13px}
.task ul{margin:6px 0 0;padding-left:18px}
.task li{margin:2px 0}
.commits{margin-top:8px;font:12px/1.5 ui-monospace,Menlo,monospace}
.commit{display:grid;grid-template-columns:62px 52px 1fr auto;gap:8px;padding:2px 0;color:var(--muted)}
.commit .s{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rollup{display:grid;gap:8px;margin-bottom:6px}
.bar{display:grid;grid-template-columns:minmax(120px,200px) 1fr 80px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px;margin:8px 0 4px}
.heat div{aspect-ratio:1;border-radius:5px;background:var(--heat0);font-size:10px;padding:3px;color:var(--muted);position:relative}
.heat div[data-l="1"]{background:var(--heat1)}.heat div[data-l="2"]{background:var(--heat2)}.heat div[data-l="3"]{background:var(--heat3);color:#fff}.heat div[data-l="4"]{background:var(--heat4);color:#fff}
.heat [data-day]{cursor:default}
.heat [data-day]:hover,.heat [data-day]:focus{outline:2px solid var(--text);outline-offset:1px}
.pop{position:fixed;z-index:10;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 12px;font-size:13px;pointer-events:none}
.pop[hidden]{display:none}
.pop h4{margin:0 0 2px;font-size:13px}
.pop .pp{margin-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pop .pt{display:flex;gap:6px;align-items:baseline;margin-top:3px}
.pop .kind{margin-top:0;font-size:9.5px}
.heat .dow{background:none;aspect-ratio:auto;text-align:center;padding:0}
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
.done-log{margin-top:22px}
.done-log>h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.dgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.dgroup>summary{list-style:none;cursor:pointer;padding:9px 14px;display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.dgroup>summary::-webkit-details-marker{display:none}
.dgroup>summary::before{content:"▸";color:var(--muted);margin-right:8px}
.dgroup[open]>summary::before{content:"▾"}
.dgroup>summary span:first-child{margin-right:auto}
.dgroup>summary .n{color:var(--muted);font-weight:400}
.row{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto auto;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 14px;cursor:pointer;color:var(--text);font:inherit;font-size:14px}
.row:hover,.row:focus-visible{background:var(--surface2);outline:none}
.row .ck{color:var(--feature)}
.row .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
[data-todo],[data-task]{cursor:pointer}
.card:hover,.task:hover{background:var(--surface2)}
.card:focus-visible,.task:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.more{font-size:12px;color:var(--accent);margin-top:4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:15;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);
  box-shadow:-12px 0 32px rgba(0,0,0,.14);z-index:16;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line);margin:0}
.drawer header h2{margin:2px 0 0;font-size:17px;line-height:1.35;flex:1}
.drawer .body{overflow:auto;padding:14px 18px 32px}
.drawer h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
.drawer .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.drawer .facts dt{color:var(--muted)}.drawer .facts dd{margin:0;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.pill.in_progress{border-color:var(--accent);color:var(--accent)}.pill.done{color:var(--feature)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;margin:0 0 10px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .when{display:block;font-size:11.5px;color:var(--muted)}
.drawer .commits.full .commit{grid-template-columns:62px 44px 1fr auto}
.drawer .commits.full .s{white-space:normal}
.sib{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.sib:hover{background:var(--surface2)}.sib.cur{border-color:var(--accent)}
.sib .m{color:var(--muted);font-size:12px}
@media (max-width:760px){.board{grid-template-columns:1fr}.row{grid-template-columns:18px minmax(0,1fr) auto}.row .m.c,.row .m.r{display:none}}
.col>h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card.in_progress{border-left:3px solid var(--accent)}
.card .id{font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.card .notes{margin:6px 0 0;padding-left:16px;font-size:13px;color:var(--muted)}
.card code{font:12px ui-monospace,Menlo,monospace;word-break:break-all}
.hint{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
@media (max-width:760px){.board{grid-template-columns:1fr}}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:560px){.commit{grid-template-columns:56px 1fr}.commit .t,.commit .d{display:none}.bar{grid-template-columns:100px 1fr 60px}}
.period{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.period button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:7px;width:28px;height:26px;cursor:pointer;font-size:13px;line-height:1}
.period button:disabled{opacity:.35;cursor:default}
.period .vs{text-transform:none;letter-spacing:0}
.kpi .delta{display:block;font-size:11.5px;margin-top:2px;color:var(--muted)}
.kpi .delta.up{color:var(--feature)}.kpi .delta.down{color:var(--fix)}
.actions{display:flex;gap:8px}
.thread{background:var(--surface);border-top:1px solid var(--line)}
.thread:first-of-type{border-top:0}
.thread>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;color:var(--text)}
.thread>summary::-webkit-details-marker{display:none}
.thread>summary::before{content:"▸";color:var(--muted);width:10px}
.thread[open]>summary::before{content:"▾"}
.thread .tn{font-weight:600}
.thread .ts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thread .task{padding-left:28px}
.hl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
.hl h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.hl ol{margin:0;padding-left:20px}
.hl li{margin:3px 0}
.hl .ts{font-size:12px;color:var(--muted)}
.tag{font-size:12px;color:var(--muted)}
.card details{margin-top:6px}
.card .commits{margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px;padding:14px}
.modal h2{margin:0;font-size:15px}
.modal textarea{flex:1;min-height:320px;width:100%;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.5 ui-monospace,Menlo,monospace}
.modal .row{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.modal .msg{margin-right:auto;font-size:13px;color:var(--muted)}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.keys{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Personal Work Tracker</h1>
      <div class="sub" id="gen"></div>
    </div>
    <div class="actions">
      <button class="btn" id="standup" title="Yesterday / Today / Blockers as text">Copy standup</button>
      <button class="btn" id="report" title="Markdown report of the period on screen">Copy report</button>
      <button class="btn" id="theme" title="Toggle theme">Theme</button>
    </div>
  </header>
  <div class="period" id="period"></div>
  <div class="kpis" id="kpis"></div>
  <div class="controls">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-v="current">Current</button>
      <button class="tab" role="tab" data-v="day">Day</button>
      <button class="tab" role="tab" data-v="week">Week</button>
      <button class="tab" role="tab" data-v="month">Month</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search tasks, repos, commits…  ( / )">
  </div>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
  <div class="keys"><kbd>c</kbd> <kbd>d</kbd> <kbd>w</kbd> <kbd>m</kbd> views · <kbd>←</kbd> <kbd>→</kbd> period · <kbd>/</kbd> search · <kbd>Esc</kbd> close / clear</div>
  <div class="pop" id="pop" hidden></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="dr-title">
    <header><h2 id="dr-title"></h2><button class="btn" id="dr-close" aria-label="Close details">✕</button></header>
    <div class="body" id="dr-body"></div>
  </aside>
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div>
      <h2 id="modal-title"></h2>
      <textarea id="modal-text" spellcheck="false"></textarea>
      <div class="row"><span class="msg" id="modal-msg"></span><button class="btn" id="modal-copy">Copy</button><button class="btn" id="modal-close">Close</button></div>
    </div>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
const TZ = "Asia/Kolkata";
const fmtDay = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short", year:"numeric", timeZone:"UTC"});
const fmtDayShort = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short", timeZone:"UTC"});
const fmtShort = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", {day:"numeric", month:"short", timeZone:"UTC"});
const fmtMonth = k => new Date(k + "-15T12:00:00Z").toLocaleDateString("en-GB", {month:"long", year:"numeric", timeZone:"UTC"});
const istDate = iso => new Date(iso).toLocaleDateString("en-CA", {timeZone: TZ});
const istTime = iso => new Date(iso).toLocaleTimeString("en-GB", {timeZone: TZ, hour:"2-digit", minute:"2-digit"});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const weekStart = d => { const x = new Date(d + "T12:00:00Z"); const k = (x.getUTCDay() + 6) % 7; x.setUTCDate(x.getUTCDate() - k); return x.toISOString().slice(0,10); };
const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); };
const addMonths = (k, n) => { const x = new Date(Date.UTC(+k.slice(0,4), +k.slice(5,7) - 1 + n, 15)); return x.toISOString().slice(0,7); };
const pl = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const sum = (ts, f) => ts.reduce((a,t) => a + f(t), 0);
const groupBy = (arr, f) => arr.reduce((m, x) => ((m[f(x)] = m[f(x)] || []).push(x), m), {});
const uniq = a => [...new Set(a)];
const span = ds => { const s = uniq(ds).sort(); return s.length === 1 ? fmtShort(s[0]) : fmtShort(s[0]) + "–" + fmtShort(s[s.length-1]); };

// ---- model: attach commits to tasks; unsummarised commits become synthetic tasks
const commits = DATA.commits.map(c => ({...c, day: istDate(c.date), time: istTime(c.date)}));
const byKey = Object.fromEntries(commits.map(c => [c.repo_path + ":" + c.sha, c]));
const firstDay = commits.reduce((m, c) => c.day < m ? c.day : m, "9999");  // DATA.since is only the last scan window
const used = new Set();
const tasks = DATA.tasks.map(t => {
  const cs = t.commits.flatMap(p => commits.filter(c => c.sha.startsWith(p)));
  cs.forEach(c => used.add(c.sha + c.repo_path));
  return {...t, thread: t.thread || "(no thread)", cs};
});
const synth = {};
commits.filter(c => !used.has(c.sha + c.repo_path)).forEach(c => { const k = c.day + "|" + c.project;
  (synth[k] = synth[k] || {id:"u-"+k, date:c.day, project:c.project, kind:"unsummarised", thread:"Not yet summarised",
    title:"Not yet summarised", summary:"These commits were made after the last summary run. They get a written summary on the next 5pm run.", details:[], cs:[]}).cs.push(c); });
tasks.push(...Object.values(synth));
tasks.forEach(t => {
  t.ins = sum(t.cs, c => c.ins); t.del = sum(t.cs, c => c.del);
  t.repos = uniq(t.cs.map(c => c.repo));
  t.times = t.cs.map(c => c.time).sort();
});
const todo = (DATA.todo || []).map(i => ({...i, cs: (i.linked || []).map(k => byKey[k]).filter(Boolean)}));
const projects = uniq([...tasks.map(t => t.project), ...todo.map(i => i.project).filter(Boolean)]).sort();

const TODAY = istDate(new Date().toISOString());
const state = {view: "current", projects: new Set(projects), q: "",
  anchor: {day: TODAY, week: weekStart(TODAY), month: TODAY.slice(0,7)}};
try { const v = localStorage.getItem("view"); if (["current","day","week","month"].includes(v)) state.view = v; } catch(e){}

const inProjects = t => state.projects.has(t.project);
const matches = t => !state.q || (t.title + t.summary + t.thread + t.details.join(" ") + t.repos.join(" ") + t.cs.map(c => c.subject).join(" ")).toLowerCase().includes(state.q);
const visible = () => tasks.filter(t => inProjects(t) && matches(t)).sort((a,b) => b.date.localeCompare(a.date) || a.project.localeCompare(b.project));

// ---- periods: each view has an anchor; the list, numbers and report all use it
const activeDays = () => uniq(visible().map(t => t.date)).sort();
const PERIOD = {
  day: {
    has: (k, t) => t.date === k,
    label: k => (k === TODAY ? "Today · " : "") + fmtDay(k),
    prev: k => { const a = activeDays().filter(d => d < k); return a.length ? a[a.length-1] : null; },
    next: k => { const a = activeDays().filter(d => d > k && d <= TODAY); return a.length ? a[0] : (k < TODAY ? TODAY : null); },
    vsLabel: k => fmtDayShort(k),
  },
  week: {
    has: (k, t) => weekStart(t.date) === k,
    label: k => (k === weekStart(TODAY) ? "This week · " : "Week of ") + fmtShort(k) + " – " + fmtShort(addDays(k, 6)),
    prev: k => addDays(k, -7) >= weekStart(firstDay) ? addDays(k, -7) : null,
    next: k => addDays(k, 7) <= weekStart(TODAY) ? addDays(k, 7) : null,
    vsLabel: k => "week of " + fmtShort(k),
  },
  month: {

function stats(ts) {

// ---- rendering pieces
function commitRows(cs) {

    `<div class="commit"><span>${c.sha.slice(0,7)}</span><span class="t">${c.time}</span><span class="s" title="${esc(c.subject)}">${esc(c.subject)}</span><span class="d"><span class="add">+${c.ins}</span> <span class="del">-${c.del}</span></span></div>`).join("");

const empty = msg => `<div class="empty">${msg}</div>`;

const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? m + "m ago" : m < 1440 ? Math.round(m/60) + "h ago" : Math.round(m/1440) + "d ago"; };

const todoVisible = () => todo.filter(i => (!i.project || state.projects.has(i.project)) &&

// ---- detail drawer: everything about one to-do task or one summarised task
const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");

const drawerOpen = () => drawer.classList.contains("on");

    ["Repos", esc(t.repos.join(", "))], ["Time", `${t.times[0]}${t.times.length > 1 ? "–" + t.times[t.times.length-1] : ""} IST`],

function openItem(el) {

function render() {
  const v = state.view, k = state.anchor[v];

  const o = document.getElementById("out"), per = document.getElementById("period");
  let cur, prev = null, vs = "";

    o.innerHTML = renderCurrent();
    per.innerHTML = `<span>All time · since ${fmtShort(firstDay)}</span>`;
    cur = stats(visible());
  } else {

    const P = PERIOD[v], pk = prevForCompare(v, k);
    per.innerHTML = `<button id="prev" aria-label="Previous period" ${P.prev(k) ? "" : "disabled"}>◀</button><span>${P.label(k)}</span><button id="next" aria-label="Next period" ${P.next(k) ? "" : "disabled"}>▶</button>` +

    .concat([[`<span class="add">+${cur.ins.toLocaleString()}</span> <span class="del">-${cur.del.toLocaleString()}</span>`, "lines", d(s => s.ins + s.del)]])
    .map(([n,l,dl]) => `<div class="kpi"><b>${n}</b><span>${l}</span>${dl}</div>`).join("");
}
function step(dir) {

}
function setView(v) { state.view = v; try { localStorage.setItem("view", v); } catch(_){} hidePop(); render(); }
function openDay(day) { state.anchor.day = day; setView("day"); scrollTo({top: 0}); }

// ---- standup and report text
// unsummarised commits: one bullet per distinct subject (same commit can exist in two repos), capped
// `covered` = commits already reported through a finished to-do; they're not listed twice
const ckey = c => c.repo_path + ":" + c.sha;
const coveredBy = items => new Set(items.flatMap(i => i.cs.map(ckey)));
function bullets(ts, indent, covered = new Set()) {

  const subs = uniq(ts.filter(t => t.kind === "unsummarised").flatMap(t => t.cs.filter(c => !covered.has(ckey(c))).map(c => c.subject)));
  subs.slice(0, 5).forEach(x => out.push(`${indent}• ${x}`));

  return out;
}
function standupText() {
  const days = uniq(tasks.filter(inProjects).map(t => t.date)).filter(d => d < TODAY).sort();
  const yd = days[days.length - 1], lines = [`Standup · ${fmtDay(TODAY)}`, ""];
  lines.push(yd ? `Yesterday (${fmtDayShort(yd)})` : "Yesterday");
  const closed = todo.filter(i => i.status === "done" && i.closed_at && istDate(i.closed_at) === yd && (!i.project || state.projects.has(i.project)));
  // a finished to-do stands in for the summarised tasks whose commits it already covers
  const covered = coveredBy(closed);
  const yts = tasks.filter(t => inProjects(t) && t.date === yd);
  closed.forEach(i => lines.push(`• Done: ${i.title}${i.project ? ` [${[i.project, i.repo].filter(Boolean).join("/")}]` : ""}`));
  Object.entries(groupBy(yts, t => t.project)).sort().forEach(([p, ts]) => { const b = bullets(ts, "  ", covered); if (b.length) lines.push(`${p}:`, ...b); });
  if (!yts.length && !closed.length) lines.push("• Nothing recorded");
  lines.push("", "Today");
  const open = todo.filter(i => (!i.project || state.projects.has(i.project)) && (i.status === "in_progress" || i.status === "todo"))
    .sort((a,b) => (a.status === "in_progress" ? 0 : 1) - (b.status === "in_progress" ? 0 : 1));
  const doneToday = todo.filter(i => i.status === "done" && i.closed_at && istDate(i.closed_at) === TODAY && (!i.project || state.projects.has(i.project)));
  doneToday.forEach(i => lines.push(`• Done: ${i.title}${i.project ? ` [${[i.project, i.repo].filter(Boolean).join("/")}]` : ""}`));
  open.forEach(i => lines.push(`• ${i.title}${i.status === "todo" ? " (next)" : ""}${i.project ? ` [${[i.project, i.repo].filter(Boolean).join("/")}]` : ""}`));

}
function reportText() {

    return L.join("\n").trim();
  }
  const k = state.anchor[v], ts = inPeriod(v, k), s = stats(ts);
  L.push(`# Work report · ${PERIOD[v].label(k)}`, "", `${pl(s.commits, "commit")} · ${pl(s.tasks, "task")} · ${pl(s.repos, "repo")} · ${pl(s.days, "active day")} · +${s.ins} / -${s.del} lines`, "");
  if (!ts.length) return L.concat("No commits in this period.").join("\n");
  if (v === "month") { L.push("## Highlights"); highlights(ts).forEach((h, n) => L.push(`${n+1}. **${h.name}** (${h.project}) · ${span(h.list.map(t => t.date))} · ${pl(h.commits, "commit")}`)); L.push(""); }
  Object.entries(groupBy(ts, t => t.project)).sort().forEach(([p, list]) => {
    L.push(`## ${p}`, "");
    threadsOf(list).forEach(th => { L.push(`### ${th.name} · ${span(th.list.map(t => t.date))} · ${pl(th.commits, "commit")}`);
      th.list.forEach(t => L.push(t.kind === "unsummarised" ? `- ${fmtShort(t.date)} · unsummarised: ${t.cs.map(c => c.subject).join("; ")}` : `- ${fmtShort(t.date)} · **${t.title}**: ${t.summary}`));
      L.push(""); });
  });
  return L.join("\n").trim();
}
const modal = document.getElementById("modal"), mText = document.getElementById("modal-text"), mMsg = document.getElementById("modal-msg");
function openModal(title, text) {
  document.getElementById("modal-title").textContent = title; mText.value = text; mMsg.textContent = ""; modal.hidden = false;
  document.getElementById("modal-copy").focus();
}
const closeModal = () => { modal.hidden = true; };
async function copyModal() {
  try { await navigator.clipboard.writeText(mText.value); mMsg.textContent = "Copied ✓"; return; } catch (_) {}
  mText.focus(); mText.select();   // file:// pages may not get the clipboard API; fall back to the legacy copy
  try { mMsg.textContent = document.execCommand("copy") ? "Copied ✓" : "Selected; press ⌘C to copy"; } catch (_) { mMsg.textContent = "Selected; press ⌘C to copy"; }
}

// ---- wiring
document.getElementById("gen").textContent = `Commits by ${DATA.author_pattern} · since ${firstDay} · refreshed ${new Date(DATA.generated_at).toLocaleString("en-GB",{timeZone:TZ})} IST`;
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) setView(b.dataset.v); });
document.getElementById("period").addEventListener("click", e => { if (e.target.id === "prev") step(-1); if (e.target.id === "next") step(1); });
const q = document.getElementById("q");
q.addEventListener("input", () => { state.q = q.value.trim().toLowerCase();
  if (/^t-\d+$/.test(state.q) && state.view !== "current" && todo.some(i => i.id === state.q)) return setView("current");   // a task id: show its card
  render(); });
document.getElementById("chips").innerHTML = projects.map(p => `<button class="chip" aria-pressed="true" data-p="${esc(p)}">${esc(p)}</button>`).join("");
document.getElementById("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return;
  const on = b.getAttribute("aria-pressed") === "true"; b.setAttribute("aria-pressed", String(!on));
  on ? state.projects.delete(b.dataset.p) : state.projects.add(b.dataset.p); render(); });
document.getElementById("theme").addEventListener("click", () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; });
document.getElementById("standup").addEventListener("click", () => openModal("Standup", standupText()));
document.getElementById("report").addEventListener("click", () => openModal("Report", reportText()));
document.getElementById("modal-copy").addEventListener("click", copyModal);
document.getElementById("modal-close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

// Month heatmap: hover / focus shows the day; click opens it in the Day view (touch: first tap previews)
const pop = document.getElementById("pop");
let popDay = null;
function showPop(cell) {
  const day = cell.dataset.day, ts = visible().filter(t => t.date === day);
  const n = sum(ts, t => t.cs.length), byP = groupBy(ts, t => t.project);
  pop.innerHTML = `<h4>${fmtDay(day)}</h4><div class="sub">${n ? pl(n, "commit") + " · " + pl(ts.length, "task") : "No commits"}</div>` +
    Object.keys(byP).sort().map(p => `<div class="pp">${esc(p)}</div>` +
      byP[p].map(t => `<div class="pt"><span class="kind ${t.kind}">${t.kind}</span><span>${esc(t.title)}</span></div>`).join("")).join("") +
    `<div class="pp">click to open the day</div>`;
  pop.hidden = false; popDay = day;
  const r = cell.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, m = 8;
  let x = r.right + m, y = r.top;
  if (x + w > innerWidth - m) x = Math.max(m, r.left - w - m);   // flip left near the right edge
  if (y + h > innerHeight - m) y = Math.max(m, innerHeight - h - m);
  pop.style.left = x + "px"; pop.style.top = y + "px";
}
function hidePop() { pop.hidden = true; popDay = null; }
const out = document.getElementById("out");
out.addEventListener("pointerover", e => { if (e.pointerType === "touch") return; const c = e.target.closest("[data-day]"); c ? showPop(c) : hidePop(); });
out.addEventListener("pointerleave", hidePop);
out.addEventListener("focusin", e => { const c = e.target.closest("[data-day]"); if (c) showPop(c); });
out.addEventListener("focusout", e => { if (!e.relatedTarget || !e.relatedTarget.closest("[data-day]")) hidePop(); });
out.addEventListener("click", e => { const c = e.target.closest("[data-day]"); if (!c) return;
  if (e.pointerType === "touch" && popDay !== c.dataset.day) { showPop(c); return; }  // first tap previews
  openDay(c.dataset.day); });
out.addEventListener("keydown", e => { const c = e.target.closest("[data-day]"); if (c && e.key === "Enter") openDay(c.dataset.day); });
addEventListener("scroll", hidePop, {passive: true});

// keyboard: c/d/w/m views, ←/→ period, / search, Esc closes the dialog or clears search
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") {
    if (!modal.hidden) closeModal(); else if (closeDrawer()) {} else if (document.activeElement === q || state.q) { q.value = ""; state.q = ""; q.blur(); render(); }
    hidePop(); return;
  }
  if (!modal.hidden || drawerOpen() || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const views = {c: "current", d: "day", w: "week", m: "month"};
  if (views[e.key]) setView(views[e.key]);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "/") { e.preventDefault(); q.focus(); }
});
render();
</script>
